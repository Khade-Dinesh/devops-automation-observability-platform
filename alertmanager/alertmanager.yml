global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'dkhade275@gmail.com'
  smtp_auth_username: 'dkhade275@gmail.com'
  smtp_auth_password_file: '/etc/alertmanager/secrets/gmail_app_password'
  smtp_require_tls: true

route:
  receiver: 'gmail-notifications'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: 'gmail-notifications'
    email_configs:
      - to: 'dkhade275@gmail.com'
        send_resolved: true
