
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "devops-flask-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["devops-api:5000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

